# 工作管理台 · 内网部署配置（完全自建，不依赖任何外部服务）
# 放置位置：/etc/nginx/conf.d/workhub.conf
#
# 端口约定：
#   本应用：8099（对外） → 127.0.0.1:8098（自建后端）
#   两个端口均可按需修改。部署到已有其他服务的机器前，先确认未被占用：
#     ss -lnt | grep -E ':(8098|8099)'
#
# 结构：
#   /        静态前端，由 Nginx 直接从 /var/www/workhub 提供
#   /api/    反代到本机 127.0.0.1:8098 的 Python 后端（登录、数据、文件）
#
# 数据去向：SQLite 文件 /var/lib/workhub/workhub.db
#           上传的文件 /var/lib/workhub/storage/
#           全程在本机磁盘，不经过公网。

server {
    listen       8099;
    listen       [::]:8099;
    server_name  _;

    root /var/www/workhub;
    index index.html;

    # 不限制上传体积（后端是流式写盘，实际只受磁盘空间限制）
    client_max_body_size 0;

    access_log /var/log/nginx/workhub.access.log;
    error_log  /var/log/nginx/workhub.error.log;

    # 后端接口
    location /api/ {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 大文件上传/下载：请求体不落盘缓冲，放宽超时
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    # 静态资源长缓存（文件名带内容 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端：SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
